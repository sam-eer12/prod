[package]
name = "padlink-cli"
description = "PadLink desktop CLI, background daemon and release manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "padlink"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossterm.workspace = true
padlink-protocol.workspace = true
zeroize.workspace = true
fs2 = "0.4.3"
getrandom.workspace = true
interprocess = "2.4"
rsa = { version = "0.9.10", features = ["sha2"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { workspace = true, features = ["oid"] }

[dev-dependencies]
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem"] }
