name: Android release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      PADLINK_ANDROID_KEYSTORE_BASE64:
        required: true
      PADLINK_ANDROID_STORE_PASSWORD:
        required: true
      PADLINK_ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching Cargo.toml (without v)'
        type: string
        required: true
        default: '0.1.2'
      publish:
        description: 'Publish the verified APK; create an Android-only release if needed'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate version and signing configuration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PADLINK_ANDROID_KEYSTORE_BASE64: ${{ secrets.PADLINK_ANDROID_KEYSTORE_BASE64 }}
          PADLINK_ANDROID_STORE_PASSWORD: ${{ secrets.PADLINK_ANDROID_STORE_PASSWORD }}
          PADLINK_ANDROID_KEY_PASSWORD: ${{ secrets.PADLINK_ANDROID_KEY_PASSWORD }}
          PADLINK_ANDROID_KEY_ALIAS: ${{ vars.PADLINK_ANDROID_KEY_ALIAS }}
          PADLINK_ANDROID_CERT_SHA256: ${{ vars.PADLINK_ANDROID_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          version = os.environ['RELEASE_VERSION']
          source = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version']
          if version != source or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Requested release must match the stable source version.')
          major, minor, patch = map(int, version.split('.'))
          code = major * 1_000_000 + minor * 1_000 + patch
          if minor >= 1000 or patch >= 1000 or not 1 <= code <= 2_100_000_000:
              raise SystemExit('Version cannot be represented as an Android versionCode.')
          for name in ('PADLINK_ANDROID_KEYSTORE_BASE64', 'PADLINK_ANDROID_STORE_PASSWORD',
                       'PADLINK_ANDROID_KEY_PASSWORD', 'PADLINK_ANDROID_KEY_ALIAS', 'PADLINK_ANDROID_CERT_SHA256'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing signing setting: {name}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PADLINK_ANDROID_VERSION_NAME={version}\nPADLINK_ANDROID_VERSION_CODE={code}\n')
          PY
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          # Signing runs outside Gradle; do not persist release build configuration.
          cache-disabled: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Install Android platform, build tools, and NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Test, lint, and assemble release APK
        working-directory: android
        run: ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Sign APK and verify certificate and alignment
        env:
          PADLINK_ANDROID_KEYSTORE_BASE64: ${{ secrets.PADLINK_ANDROID_KEYSTORE_BASE64 }}
          PADLINK_ANDROID_STORE_PASSWORD: ${{ secrets.PADLINK_ANDROID_STORE_PASSWORD }}
          PADLINK_ANDROID_KEY_PASSWORD: ${{ secrets.PADLINK_ANDROID_KEY_PASSWORD }}
          PADLINK_ANDROID_KEY_ALIAS: ${{ vars.PADLINK_ANDROID_KEY_ALIAS }}
          PADLINK_ANDROID_CERT_SHA256: ${{ vars.PADLINK_ANDROID_CERT_SHA256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python3 packaging/sign_android_release.py
          --apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          --out android-dist --version "$RELEASE_VERSION"
      - name: Upload verified APK and SHA-256 checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-signed-release
          path: android-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-signed-release
          path: android-dist
      - name: Publish verified Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" android-dist/* --clobber
          else
            gh release create "v$RELEASE_VERSION" android-dist/* --target "$GITHUB_SHA" \
              --title "PadLink Android $RELEASE_VERSION" --notes-file packaging/ANDROID_RELEASE_NOTES.md --latest=false
          fi
