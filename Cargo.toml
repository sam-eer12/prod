[workspace]
resolver = "3"
members = ["desktop", "protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
chacha20poly1305 = "0.10.1"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
hkdf = "0.12.4"
padlink-protocol = { path = "protocol" }
sha2 = "0.10.9"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
